name: CI

# The contract test has to run on every merge, not just when somebody remembers.
# A broken response envelope is silent: the evaluator swallows it and scores the
# turn empty, so nothing in the score breakdown says why.
on:
  push:
    branches: [main, "claude/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # test_entry_point diffs against HEAD to assert the evaluator files
          # are unmodified, so it needs real history rather than a shallow clone.
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Tests
        run: pytest

      - name: Offline verification
        # Needs the 58 MB catalog, which is not always present in a checkout.
        # Skip rather than fail, and say which happened.
        run: |
          if [ -f techjam-conversational-search/data/catalog.jsonl ]; then
            python evaluation/verify_offline.py
          else
            echo "catalog.jsonl absent, skipping the offline probe"
          fi

      - name: Evaluator files unmodified
        # Belt and braces alongside the test. The submission rules forbid
        # editing evaluator files and treat a modified run as invalid.
        run: |
          if ! git diff --quiet origin/main -- techjam-conversational-search/evaluator/ 2>/dev/null; then
            echo "::error::evaluator files differ from main. The rules forbid modifying them."
            git diff --stat origin/main -- techjam-conversational-search/evaluator/ || true
            exit 1
          fi
          echo "evaluator untouched"
